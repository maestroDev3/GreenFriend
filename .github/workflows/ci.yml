name: CI

# Push covers task branches and main; no separate pull_request trigger, so
# every commit is tested once (saves Actions minutes).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Skip if project not scaffolded yet
        id: guard
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
        if: steps.guard.outputs.ok == 'true'
      - name: Analyze
        if: steps.guard.outputs.ok == 'true'
        run: flutter analyze 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}
      - name: Format
        if: always() && steps.guard.outputs.ok == 'true'
        run: |
          dart format lib test > /dev/null
          git diff -- lib test > format.log
          if [ -s format.log ]; then echo "dart format would change these files:"; cat format.log; exit 1; fi
      - name: Test
        if: always() && steps.guard.outputs.ok == 'true'
        run: flutter test --reporter expanded 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # Post failure output as a commit comment so it can be read via the API
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### CI failed'; echo '```'; tail -c 30000 analyze.log 2>/dev/null; echo; echo '--- format ---'; tail -c 15000 format.log 2>/dev/null; echo; echo '--- test ---'; grep -vE ': loading ' test.log 2>/dev/null | tail -c 30000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null

  # Build the APK only on main; on branches only with “[apk]” in the commit message
  # (saves ~6 min per TDD cycle).
  build-apk:
    needs: test
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fixed signing key from repository secrets, so updates install over the
      # previous APK. Without secrets the debug key is used (new key per run).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key configured - using the debug key"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: green_friend-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # On main: publish the APK as release “latest” (direct download on the phone)
      - name: Release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk green_friend.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest green_friend.apk --target "$GITHUB_SHA" \
            --title "Green Friend (latest)" \
            --notes "Built automatically from ${GITHUB_SHA::7}. To install, download green_friend.apk on your phone and open it."
